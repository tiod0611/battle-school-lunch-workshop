services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - NEIS_API_KEY=${NEIS_API_KEY}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - DATABASE_PATH=${DATABASE_PATH:-./data/app.db}
      - TOURNAMENT_RUN_HOUR=${TOURNAMENT_RUN_HOUR:-0}
      - TOURNAMENT_RUN_MINUTE=${TOURNAMENT_RUN_MINUTE:-10}
    restart: unless-stopped

  mcp:
    build: ./src/mcp
    ports:
      - "8100:8100"
    environment:
      - NEIS_API_KEY=${NEIS_API_KEY}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-8100}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
